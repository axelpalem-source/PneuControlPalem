
<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171717">
<title>PneuControlPalem</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 16px;
    background: #171717;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 450px;
    margin: auto;
}

header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 10px 0 35px;
}

.logo {
    width: 58px;
    height: 58px;
    background: #FFD500;
    color: #171717;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
}

h1 {
    font-size: 21px;
    margin: 0;
    letter-spacing: 1px;
}

.subtitle {
    color: #FFD500;
    font-size: 11px;
    margin-top: 6px;
    letter-spacing: 1px;
}

label {
    display: block;
    font-size: 15px;
    font-weight: bold;
    margin: 23px 0 9px;
}

input {
    width: 100%;
    padding: 17px;
    border: 1px solid #454545;
    border-radius: 9px;
    background: #303030;
    color: white;
    font-size: 23px;
    outline: none;
}

input:focus {
    border-color: #FFD500;
}

.resultat {
    background: #303030;
    border-radius: 12px;
    padding: 24px;
    margin-top: 30px;
}

.resultat-label {
    color: white;
    font-size: 13px;
    letter-spacing: 1px;
}

.pourcentage {
    color: #FFD500;
    font-size: 45px;
    font-weight: 900;
    margin-top: 12px;
}

.reference {
    text-align: center;
    color: #AAAAAA;
    font-size: 12px;
    margin: 22px 0;
}

button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 9px;
    background: #FFD500;
    color: #171717;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
}

footer {
    text-align: center;
    color: #777777;
    font-size: 11px;
    margin-top: 30px;
}
</style>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>
</head>

<body>

<div class="container">

<header>
    <div class="logo">PCP</div>
    <div>
        <h1>PNEUCONTROLPALEM</h1>
        <div class="subtitle">CONTRÔLE PNEUMATIQUES</div>
    </div>
</header>

<label>Profondeur à neuf (mm)</label>
<input type="text" inputmode="decimal"
id="neuf" placeholder="Ex : 8,0">

<label>Profondeur relevée (mm)</label>
<input type="text" inputmode="decimal"
id="mesure" placeholder="Ex : 4,0">

<div class="resultat">
    <div class="resultat-label">TAUX D'USURE</div>
    <div class="pourcentage" id="resultat">— %</div>
</div>

<div class="reference">
    SEUIL DE RÉFÉRENCE : 1,6 MM = 100 %
</div>

<button onclick="effacer()">
    EFFACER LES VALEURS
</button>

<footer>
    PneuControlPalem · Outil de mesure pneumatiques
</footer>

</div>

<script>
const seuil = 1.6;

function calculer() {

    const neufTexte = document.getElementById("neuf").value.trim().replace(",", ".");
    const mesureTexte = document.getElementById("mesure").value.trim().replace(",", ".");

    const neuf = neufTexte === "" ? NaN : Number(neufTexte);
    const mesure = mesureTexte === "" ? NaN : Number(mesureTexte);

    const resultat = document.getElementById("resultat");

    if (!Number.isFinite(neuf) ||
        !Number.isFinite(mesure) ||
        neuf <= seuil ||
        mesure < 0) {

        resultat.textContent = "— %";
        return;
    }

    const usure = Math.max(
        0,
        ((neuf - mesure) / (neuf - seuil)) * 100
    );

    resultat.textContent =
        usure.toLocaleString("fr-FR", {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        }) + " %";
}

function effacer() {

    document.getElementById("neuf").value = "";
    document.getElementById("mesure").value = "";

    document.getElementById("resultat").textContent = "— %";
}

document.getElementById("neuf")
.addEventListener("input", calculer);

document.getElementById("mesure")
.addEventListener("input", calculer);

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>
</body>
</html>
